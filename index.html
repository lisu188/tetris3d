<!DOCTYPE html>
<html>
<head>
    <title>tetris3d</title>
    <meta http-equiv="content-type" content="text/html; charset=ISO-8859-1">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
    <style type="text/css">
        body {
            background-color: #000000;
            overflow: hidden;
        }
    </style>
    <script src="./three.js"></script>
    <script src="./OrbitControls.js"></script>
    <script src="./tetris3d.js"></script>
</head>
<body>
<div id="WebGLCanvas"></div>
<script>
    // Global scene object
    var scene;

    // Global camera object
    var camera;

    var renderer;


    // Initialize the scene
    initializeScene();

    let tetrisBoard = new TetrisBoard(12, 12, 12);
    tetrisBoard.addBlock([5, 5, 10], 0);

    setInterval(function () {
        tetrisBoard.advance();
        render();
    }, 100);

    render();

    function initializeScene() {
        renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setClearColor(0x000000, 1);

        var canvasWidth = window.innerWidth;
        var canvasHeight = window.innerHeight;

        renderer.setSize(canvasWidth, canvasHeight);

        document.getElementById("WebGLCanvas").appendChild(renderer.domElement);

        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(45, canvasWidth / canvasHeight, 1, 100);
        camera.position.set(25, 25, 25);
        camera.lookAt(scene.position);


        scene.add(camera);

        cubeGeometry = new THREE.BoxBufferGeometry(1, 1, 1);

        blockMaterial = new THREE.MeshBasicMaterial({color: 0xff0000, wireframe: true});
        filledMaterial = new THREE.MeshBasicMaterial({color: 0x0000ff, wireframe: true});
        floorMaterial = new THREE.MeshBasicMaterial({color: 0x00ff00})
    }


    function render() {
        //TODO: move all to TetrisClass or Tetris renderer
        //TODO: dirty
        while (scene.children.length > 0) {
            scene.remove(scene.children[0]);
        }

        scene.add(camera);


        tetrisBoard.getBlocks(tetrisBoard).forEach(function (block) {
            const cubeMesh = new THREE.Mesh(cubeGeometry, blockMaterial);
            cubeMesh.position.set(block[0], block[2], block[1]);
            scene.add(cubeMesh);
        });

        tetrisBoard.getFilled(tetrisBoard).forEach(function (block) {
            const cubeMesh = new THREE.Mesh(cubeGeometry, filledMaterial);
            cubeMesh.position.set(block[0], block[2], block[1]);
            scene.add(cubeMesh);
        });

        for (let i = 0; i < tetrisBoard.x; i++) {
            for (let j = 0; j < tetrisBoard.y; j++) {
                const cubeMesh = new THREE.Mesh(cubeGeometry, floorMaterial);
                cubeMesh.position.set(i, -1, j);
                scene.add(cubeMesh);
            }
        }


        renderer.render(scene, camera);
    }
</script>
</body>
</html>
