<!DOCTYPE html>
<html>
<head>
    <title>tetris3d</title>
    <meta http-equiv="content-type" content="text/html; charset=ISO-8859-1">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
    <style type="text/css">
        body {
            background-color: #000000;
            overflow: hidden;
        }
    </style>
    <script src="./three.min.js"></script>
    <script src="./tetris3d.js"></script>
</head>
<body>
<div id="WebGLCanvas"></div>
<script>
    // Global scene object
    let scene;

    // Global camera object
    let camera;

    let renderer;


    // Initialize the scene
    initializeScene();

    let tetrisBoard = new TetrisBoard(6, 6, 10);

    setInterval(function () {
        tetrisBoard.advance();
        render();
    }, 1000);

    render();

    function initializeScene() {
        renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setClearColor(0x000000, 1);

        const canvasWidth = window.innerWidth;
        const canvasHeight = window.innerHeight;

        renderer.setSize(canvasWidth, canvasHeight);

        document.getElementById("WebGLCanvas").appendChild(renderer.domElement);

        document.addEventListener("keypress", function (event) {
            switch (String.fromCharCode(event.which || event.keyCode)) {
                case 'w':
                    tetrisBoard.move(0, 1, 0);
                    break;
                case 's':
                    tetrisBoard.move(0, -1, 0);
                    break;
                case 'a':
                    tetrisBoard.move(-1, 0, 0);
                    break;
                case 'd':
                    tetrisBoard.move(1, 0, 0);
                    break;
            }
            render()
        });

        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(45, canvasWidth / canvasHeight, 1, 100);
        camera.position.set(50, 50, 50);
        camera.lookAt(scene.position);

        scene.add(camera);

        let light = new THREE.PointLight(0xFFFFFF, 1, 100000);
        light.position.set(50, 50, 50);
        scene.add(light);


        cubeGeometry = new THREE.BoxBufferGeometry(1, 1, 1);

        blockMaterial = new THREE.MeshBasicMaterial({color: 0xff0000, wireframe: true});
        filledMaterial = new THREE.MeshBasicMaterial({color: 0x0000ff, wireframe: true});
        floorMaterial = new THREE.MeshBasicMaterial({color: 0x00ff00, wireframe: true})
    }


    function render() {
        //TODO: move all to TetrisClass or Tetris renderer
        //TODO: dirty
        while (scene.children.length > 0) {
            scene.remove(scene.children[0]);
        }

        scene.add(camera);

        xes = {};
        yes = {};

        tetrisBoard.getRawBlocks().forEach(function (blockDef) {
            blockDef.forEach(function (block) {
                const cubeMesh = new THREE.Mesh(cubeGeometry, blockMaterial);
                cubeMesh.position.set(block.x, block.z, block.y);
                xes[block.x] = true
                yes[block.y] = true
                scene.add(cubeMesh);
            })
        });

        tetrisBoard.getFilled().forEach(function (block) {
            const cubeMesh = new THREE.Mesh(cubeGeometry, filledMaterial);
            cubeMesh.position.set(block.x, block.z, block.y);
            scene.add(cubeMesh);
        });

        for (let i = 0; i < tetrisBoard.x; i++) {
            for (let j = 0; j < tetrisBoard.y; j++) {
                let material;
                if (xes[i] && yes[j]) {
                    material = blockMaterial
                } else {
                    material = floorMaterial
                }
                const cubeMesh = new THREE.Mesh(cubeGeometry, material);
                cubeMesh.position.set(i, -1, j);
                scene.add(cubeMesh);
            }
        }

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
